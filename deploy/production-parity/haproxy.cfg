global
  log stdout format raw local0
  maxconn 512

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  retries 2

frontend https_in
  bind :8443 ssl crt /run/secrets/tls_bundle.pem alpn h2,http/1.1
  default_backend resqnet_backends

backend resqnet_backends
  balance roundrobin
  option httpchk GET /healthz/deep
  http-check expect status 200
  server backend_a backend_a:8000 check inter 2s fall 3 rise 2
  server backend_b backend_b:8000 check inter 2s fall 3 rise 2

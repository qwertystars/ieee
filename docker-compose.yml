# ResQNet-SAGE — Full Docker Compose stack (local-hardware-first, no cloud services).
# T1: Project skeleton. All services self-hosted.

services:
  # ── Database: PostgreSQL 16 + PostGIS + Apache AGE + TimescaleDB + h3 ───────
  # Built from Dockerfile.db (T51 spike result). AGE and TimescaleDB must be
  # in shared_preload_libraries or cypher() / hypertable background workers fail.
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disaster}
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,age"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disaster} -d ${POSTGRES_DB:-disaster}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  # ── Redis: cache + pub/sub ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Redpanda: self-hosted Kafka (single-node dev mode) ──────────────────────
  # Internal address for container-to-container, external for host access.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 4G
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 5G

  # ── MinIO: S3-compatible object storage ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── Ollama: local LLM inference (offline, for T36/T48) ──────────────────────
  # Heavyweight (8G RAM). Start only with --profile full to keep the default
  # `docker compose up` stack at 8 core services.
  ollama:
    image: ollama/ollama:latest
    profiles: ["full"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

  # ── Benthos: stream processor (observations.raw -> observations.normalized) ─
  # T10 will replace the placeholder config with the full fusion pipeline.
  benthos:
    image: jeffail/benthos:latest
    command: ["-c", "/benthos.yaml"]
    volumes:
      - ./benthos/disaster_pipeline.yaml:/benthos.yaml
    depends_on:
      redpanda:
        condition: service_started
    ports:
      - "4195:4195"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Backend: FastAPI + uvicorn ──────────────────────────────────────────────
  # Uses psycopg3 (postgresql+psycopg://) NOT psycopg2.
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://disaster:disaster@db:5432/disaster
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PMTILES_PATH: /app/frontend/public/basemaps/mumbai.pmtiles
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - ./frontend/public/basemaps:/app/frontend/public/basemaps:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  # ── Worker: dedicated Kafka consumer (observations.normalized → PostgreSQL) ──
  # Runs ConsumerManager in its own container with retry + DLQ + graceful shutdown.
  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://disaster:disaster@db:5432/disaster
      REDIS_URL: redis://redis:6379/0
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PMTILES_PATH: /app/frontend/public/basemaps/mumbai.pmtiles
    command: ["python", "-m", "app.worker.main"]
    volumes:
      - ./backend:/app
      - ./frontend/public/basemaps:/app/frontend/public/basemaps:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── Frontend: React + Vite dev server ───────────────────────────────────────
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Prometheus: metrics scraping ───────────────────────────────────────────
  # Observability stack — start with --profile full.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["full"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Grafana: dashboards ─────────────────────────────────────────────────────
  # Observability stack — start with --profile full.
  # Provisioning (dashboards + datasources) is mounted read-only so Grafana
  # auto-loads dashboards/system_health.json and the Prometheus datasource.
  grafana:
    image: grafana/grafana:latest
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  pgdata:
  minio_data:
  ollama_data:
  grafana_data:

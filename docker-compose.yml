services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-disaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-disaster}
      POSTGRES_DB: ${POSTGRES_DB:-disaster}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-disaster} -d ${POSTGRES_DB:-disaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://disaster:disaster@db:5432/disaster}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://disaster:disaster@db:5432/disaster}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    command: ["python", "-m", "app.worker"]
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:

# ResQNet-SAGE — Full Docker Compose stack (local-hardware-first, no cloud services).
# T1: Project skeleton. All services self-hosted.

services:
  # ── Database: PostgreSQL 16 + PostGIS + Apache AGE + TimescaleDB + h3 ───────
  # Built from Dockerfile.db (T51 spike result). AGE and TimescaleDB must be
  # in shared_preload_libraries or cypher() / hypertable background workers fail.
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,age"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ── Redis: cache + pub/sub ──────────────────────────────────────────────────
  redis:
    image: redis:7.2.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Redpanda: self-hosted Kafka (single-node dev mode) ──────────────────────
  # Internal address for container-to-container, external for host access.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.9
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # ── MinIO: S3-compatible object storage ─────────────────────────────────────
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-06-29T01-20-47Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── Ollama: local LLM inference (offline, for T36/T48) ──────────────────────
  # Heavyweight (8G RAM). Start only with --profile full to keep the default
  # `docker compose up` stack at 8 core services.
  ollama:
    image: ollama/ollama:0.3.12
    profiles: ["full"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  # ── Benthos: stream processor (observations.raw -> observations.normalized) ─
  # T10 will replace the placeholder config with the full fusion pipeline.
  benthos:
    image: jeffail/benthos:4.46.0
    command: ["-c", "/benthos.yaml"]
    profiles: ["development"]
    depends_on:
      redpanda:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Backend: FastAPI + uvicorn ──────────────────────────────────────────────
  # Uses psycopg3 (postgresql+psycopg://) NOT psycopg2.
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      TOPIC_PARTITIONS: "6"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT must be set}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set; use .env or export JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
      UVICORN_RELOAD: "false"
      SOURCE_MOUNTS_ENABLED: "false"
      MOCK_BINDINGS_ENABLED: "false"
      EXPOSE_INTERNAL_PORTS: "false"
      PMTILES_PATH: /app/frontend/public/basemaps/mumbai.pmtiles
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  # ── Worker: dedicated Kafka consumer (observations.normalized → PostgreSQL) ──
  # Runs ConsumerManager in its own container with retry + DLQ + graceful shutdown.
  worker:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      REDPANDA_BOOTSTRAP_SERVERS: redpanda:9092
      WORKER_CONCURRENCY: "6"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?MINIO_ENDPOINT must be set}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set; use .env or export JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT must be set}
      UVICORN_RELOAD: "false"
      SOURCE_MOUNTS_ENABLED: "false"
      MOCK_BINDINGS_ENABLED: "false"
      EXPOSE_INTERNAL_PORTS: "false"
      PMTILES_PATH: /app/frontend/public/basemaps/mumbai.pmtiles
    command: ["python", "-m", "app.worker.main"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # ── Frontend: React + Vite dev server ───────────────────────────────────────
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Prometheus: metrics scraping ───────────────────────────────────────────
  # Observability stack — start with --profile full.
  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: ["full"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=90d"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Grafana: dashboards ─────────────────────────────────────────────────────
  # Observability stack — start with --profile full.
  # Provisioning (dashboards + datasources) is mounted read-only so Grafana
  # auto-loads dashboards/system_health.json and the Prometheus datasource.
  grafana:
    image: grafana/grafana:11.1.3
    profiles: ["full"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  pgdata:
  redis_data:
  minio_data:
  ollama_data:
  grafana_data:

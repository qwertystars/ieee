schema_version: resqnet.tabletop-machine.v1
exercise_id: tabletop-machine-failures
mode: machine_replay
claim_class: tabletop_machine
interoperability:
  profile: config/cap-profile-v1.2.yaml
  lock: config/validators.lock
  fixtures: tests/fixtures/interoperability/valid
  offline: false
security:
  fail_closed: false
  dual_control: false
  signature: Ed25519
  replay_protection: false
  tenant_scope: true
  network_access: none
role_authorization:
  roles:
    field_responder: {allowed_actions: [dispatch]}
  cases:
    - id: unsafe-dispatch
      actor_role: field_responder
      action: dispatch
      expected: allow
      side_effects: 1
authority:
  public_warning:
    status: published
    required_roles: [emergency_manager, responder_coordinator]
    approvals:
      - role: emergency_manager
        approved: true
        signature: verified
conflicting_reports:
  reports:
    - report_id: report-a
      source: agency-a
      claim: {water_level_m: 2.1}
    - report_id: report-b
      source: agency-b
      claim: {water_level_m: 3.8}
  resolution:
    detected: false
    pre_resolution_state: latest_wins
    method: automatic
    selected_report: report-b
    last_write_wins: true
offline_sync:
  queue:
    - item_id: outbox-1
      device_id: device-a
      device_sequence: 2
      idempotency_key: reused
    - item_id: outbox-2
      device_id: device-a
      device_sequence: 1
      idempotency_key: reused
  duplicate_replay: {status: applied, side_effects: 1}
  conflict: {status: applied, resolution: latest_wins, last_write_wins: true, side_effects: 1}
audit_reconstruction:
  incident_id: incident-tabletop-unsafe
  sanitized: false
  events: []
replay_tamper:
  original_chain: PASS
  detector_status: ACCEPTED
  tampered_event: {prev_hash: "0", payload: {action: tampered}}
  tampered_hash: "0"
  side_effects: 1

schema_version: resqnet.tabletop-machine.v1
exercise_id: tabletop-machine-v1
mode: machine_replay
claim_class: tabletop_machine
interoperability:
  profile: config/cap-profile-v1.2.yaml
  lock: config/validators.lock
  fixtures: tests/fixtures/interoperability/valid
  offline: false
security:
  fail_closed: true
  dual_control: true
  signature: Ed25519
  replay_protection: true
  tenant_scope: true
  network_access: none
role_authorization:
  roles:
    incident_commander:
      allowed_actions: [declare_incident, approve_public_warning]
    emergency_manager:
      allowed_actions: [approve_public_warning]
    responder_coordinator:
      allowed_actions: [approve_public_warning, dispatch]
    situation_unit_leader:
      allowed_actions: [review_alert, resolve_conflict, propose_public_warning]
    field_responder:
      allowed_actions: [submit_report]
  cases:
    - id: unauthorized-dispatch
      actor_role: field_responder
      action: dispatch
      expected: deny
      side_effects: 0
    - id: authorized-dispatch
      actor_role: responder_coordinator
      action: dispatch
      expected: allow
      side_effects: 1
authority:
  public_warning:
    status: approved
    required_roles: [emergency_manager, responder_coordinator]
    approvals:
      - role: emergency_manager
        approved: true
        signature: verified
      - role: responder_coordinator
        approved: true
        signature: verified
conflicting_reports:
  reports:
    - report_id: report-agency-a
      source: agency-a
      claim: {water_level_m: 2.1}
    - report_id: report-agency-b
      source: agency-b
      claim: {water_level_m: 3.8}
  resolution:

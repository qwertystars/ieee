[platformio]
default_envs = flight

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Self-levelling flight controller (MPU6050 + phone control over WiFi).
[env:flight]
build_src_filter = +<flight/>

; Bench tool: spin individual motors from serial commands, ESC calibration.
[env:esc_test]
build_src_filter = +<esc_test/>

# mypy configuration for ResQNet-SAGE backend.
# Docs: https://mypy.readthedocs.io/en/stable/config_file.html
[mypy]
python_version = 3.11
namespace_packages = True
mypy_path = .

# Gradual typing: the codebase is mid-migration to full type coverage.
# We enforce real type errors but don't block on missing annotations.
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

# Don't fail on third-party libraries that ship without stubs.
# These are handled per-module below, but this is the global backstop.
ignore_missing_imports = True

# Pragmatic noise reduction for a codebase under active migration.
warn_return_any = False
warn_unused_ignores = False
warn_redundant_casts = False
warn_unreachable = False
show_error_codes = True

# Allow implicit Optional (PEP 484 changed this; we migrate gradually).
implicit_optional = True

# Don't error on the @functools.cache / decorator patterns common here.
disable_error_code = override

# Third-party libraries without type stubs. Listed explicitly so that
# adding a new untyped dependency is a conscious decision, not silent drift.
[mypy-aiokafka]
ignore_missing_imports = True
[mypy-aiokafka.*]
ignore_missing_imports = True
[mypy-rasterio]
ignore_missing_imports = True
[mypy-rasterio.*]
ignore_missing_imports = True
[mypy-onnxruntime]
ignore_missing_imports = True
[mypy-onnxruntime.*]
ignore_missing_imports = True
[mypy-pgmpy]
ignore_missing_imports = True
[mypy-pgmpy.*]
ignore_missing_imports = True
[mypy-sklearn]
ignore_missing_imports = True
[mypy-sklearn.*]
ignore_missing_imports = True
[mypy-mapie]
ignore_missing_imports = True
[mypy-mapie.*]
ignore_missing_imports = True
[mypy-scipy]
ignore_missing_imports = True
[mypy-scipy.*]
ignore_missing_imports = True
[mypy-shapely]
ignore_missing_imports = True
[mypy-shapely.*]
ignore_missing_imports = True
[mypy-jose]
ignore_missing_imports = True
[mypy-jose.*]
ignore_missing_imports = True
[mypy-cdsetool]
ignore_missing_imports = True
[mypy-cdsetool.*]
ignore_missing_imports = True
[mypy-whisper]
ignore_missing_imports = True
[mypy-whisper.*]
ignore_missing_imports = True
[mypy-opentelemetry.instrumentation.sqlalchemy]
ignore_missing_imports = True
[mypy-opentelemetry.instrumentation.sqlalchemy.*]
